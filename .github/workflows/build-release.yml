name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Install pioarduino platform
        run: pio pkg install -g -p "https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip"

      - name: Run PlatformIO Build
        run: pio run -e esp32-c6-super-mini

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .pio/build/esp32-c6-super-mini/firmware.bin
            .pio/build/esp32-c6-super-mini/bootloader.bin
            .pio/build/esp32-c6-super-mini/partitions.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
