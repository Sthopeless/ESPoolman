; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;

[credentials]
wifi_ssid     = 
wifi_pass     = 
spoolman_url  = 
moonraker_url = 

[common]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

board_build.mcu        = esp32c6
board_build.f_cpu      = 160000000L
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

upload_speed = 921600
board_upload.before_reset = usb_reset
board_upload.after_reset = hard_reset

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DCONFIG_WIFI_SSID="${credentials.wifi_ssid}"'
    '-DCONFIG_WIFI_PASS="${credentials.wifi_pass}"'
    '-DCONFIG_SPOOLMAN_URL="${credentials.spoolman_url}"'
    '-DCONFIG_MOONRAKER_URL="${credentials.moonraker_url}"'

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    fastled/FastLED@^3.10.3
    computer991/Arduino_MFRC522v2@^2.0.1
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    gyverlibs/TimerMs

[env:esp32-c6-super-mini]
extends = common

[env:esp32-c6-super-mini-ota]
extends = common
upload_protocol = espota
upload_port = 192.168.1.100
